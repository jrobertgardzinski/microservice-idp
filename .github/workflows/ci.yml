name: CI

# Python stdlib only — the unittest suite runs as-is; fast per-push feedback.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run the tests
        run: python -m unittest test_server.py -v
